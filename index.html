<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sèvres — date et météo</title>
<style>
  :root{
    --bg: #eef2f2;
    --panel: #ffffff;
    --ink: #1c2b2f;
    --ink-soft: #4d6066;
    --rule: #c7d3d2;
    --blue: #1c6ea4;
    --blue-deep: #123f5c;
    --gilt: #a9803f;
    --shadow: 0 1px 2px rgba(28,43,47,.06), 0 12px 32px -16px rgba(28,43,47,.22);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #10181b;
      --panel: #162327;
      --ink: #e9eff0;
      --ink-soft: #9fb2b6;
      --rule: #2b3d42;
      --blue: #5fa8d3;
      --blue-deep: #bcdcee;
      --gilt: #c9a361;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 40px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg: #10181b;
    --panel: #162327;
    --ink: #e9eff0;
    --ink-soft: #9fb2b6;
    --rule: #2b3d42;
    --blue: #5fa8d3;
    --blue-deep: #bcdcee;
    --gilt: #c9a361;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 40px -20px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --bg: #eef2f2;
    --panel: #ffffff;
    --ink: #1c2b2f;
    --ink-soft: #4d6066;
    --rule: #c7d3d2;
    --blue: #1c6ea4;
    --blue-deep: #123f5c;
    --gilt: #a9803f;
    --shadow: 0 1px 2px rgba(28,43,47,.06), 0 12px 32px -16px rgba(28,43,47,.22);
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 20px;
    background:
      radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--blue) 7%, transparent), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }

  .plate{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:3px;
    position:relative;
  }
  .plate::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid var(--gilt);
    border-radius:3px;
    opacity:.55;
    pointer-events:none;
  }
  .plate-inner{
    padding:38px 34px 30px;
    text-align:center;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--blue);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-family: "Iowan Old Style","Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size:29px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--blue-deep);
    margin:0 0 2px;
    text-wrap: balance;
  }
  .dept{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 22px;
  }

  .divider{
    width:56px; height:1px;
    background:var(--gilt);
    opacity:.6;
    margin:0 auto 22px;
  }

  .date{
    font-family: "Iowan Old Style","Palatino Linotype", Palatino, Georgia, serif;
    font-size:19px;
    color:var(--ink);
    margin:0 0 2px;
    text-transform:capitalize;
  }
  .time{
    font-variant-numeric: tabular-nums;
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 26px;
  }

  .weather{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:6px;
  }
  .weather svg{ width:46px; height:46px; flex:none; }
  .temp-block{ text-align:left; }
  .temp{
    font-variant-numeric: tabular-nums;
    font-size:40px;
    line-height:1;
    font-weight:600;
    color:var(--ink);
  }
  .condition{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:3px;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0;
    margin-top:24px;
    padding-top:16px;
    border-top:1px solid var(--rule);
  }
  .stat{ padding:0 3px; }
  .stat .label{
    font-size:9.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .stat .value{
    font-variant-numeric: tabular-nums;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
  }

  .source{
    margin-top:24px;
    font-size:10.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .source a{ color:var(--blue); text-decoration:none; }
  .source a:hover{ text-decoration:underline; }
</style>

<div class="plate">
  <div class="plate-inner">
    <p class="eyebrow">Hauts-de-Seine · 92310</p>
    <h1>Sèvres</h1>
    <p class="dept">France</p>
    <div class="divider"></div>

    <p class="date" id="date"></p>
    <p class="time" id="time"></p>

    <div class="weather">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="10" fill="var(--blue)"/>
        <g stroke="var(--blue)" stroke-width="2.4" stroke-linecap="round">
          <line x1="24" y1="2" x2="24" y2="9"/>
          <line x1="24" y1="39" x2="24" y2="46"/>
          <line x1="2" y1="24" x2="9" y2="24"/>
          <line x1="39" y1="24" x2="46" y2="24"/>
          <line x1="8.2" y1="8.2" x2="13.3" y2="13.3"/>
          <line x1="34.7" y1="34.7" x2="39.8" y2="39.8"/>
          <line x1="8.2" y1="39.8" x2="13.3" y2="34.7"/>
          <line x1="34.7" y1="13.3" x2="39.8" y2="8.2"/>
        </g>
      </svg>
      <div class="temp-block">
        <div class="temp">31°</div>
        <div class="condition">Ciel dégagé</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">Ressenti</div>
        <div class="value">33°</div>
      </div>
      <div class="stat">
        <div class="label">Humidité</div>
        <div class="value">38%</div>
      </div>
      <div class="stat">
        <div class="label">Min / Max</div>
        <div class="value">21° / 38°</div>
      </div>
      <div class="stat">
        <div class="label">Population</div>
        <div class="value">22 303</div>
      </div>
    </div>

    <p class="source">
      Relevé du 29 juillet 2026, 11h45 (Europe/Paris) ·
      données <a href="https://open-meteo.com" target="_blank" rel="noopener">Open‑Meteo</a> ·
      population <a href="https://www.insee.fr/fr/statistiques/2011101?geo=COM-92072" target="_blank" rel="noopener">Insee</a> (2023)
    </p>
  </div>
</div>

<script>
  function tick(){
    var now = new Date();
    var dateFmt = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
    var timeFmt = new Intl.DateTimeFormat("fr-FR", { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Paris" });
    document.getElementById("date").textContent = dateFmt.format(now);
    document.getElementById("time").textContent = timeFmt.format(now) + " (heure de Paris)";
  }
  tick();
  setInterval(tick, 1000 * 30);
</script>
